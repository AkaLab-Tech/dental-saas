name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dental_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: dental_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No test-env setup step: test.env is committed, and the env: block on
      # the test step below is the authoritative source for CI (it wins over
      # test.env, which dotenv only applies to unset variables).

      - name: Build shared package
        run: pnpm --filter @dental/shared build

      - name: Generate Prisma client
        run: pnpm --filter @dental/database db:generate
        env:
          DATABASE_URL: postgresql://dental_test:test_password@localhost:5432/dental_test?schema=public

      - name: Build database package
        run: pnpm --filter @dental/database build

      - name: Run database migrations
        run: pnpm --filter @dental/database db:migrate
        env:
          DATABASE_URL: postgresql://dental_test:test_password@localhost:5432/dental_test?schema=public

      - name: Run backend tests
        run: pnpm --filter @dental/api test
        env:
          DATABASE_URL: postgresql://dental_test:test_password@localhost:5432/dental_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_32_characters_long
          SETUP_KEY: test_setup_key_16chars
          NODE_ENV: test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @dental/shared build

      - name: Run app unit tests
        run: pnpm --filter @dental/app test

      - name: Run web unit tests
        if: ${{ !cancelled() }}
        run: pnpm --filter @dental/web test

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dental_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: dental_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://dental_test:test_password@localhost:5432/dental_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_32_characters_long
      SETUP_KEY: test_setup_key_16chars
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5002
      PORT: 5001
      VITE_API_URL: http://localhost:5001
      VITE_APP_PORT: 5002
      VITE_WEB_PORT: 5003

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write root .env for dev servers
        # apps/api's dev script (tsx watch --env-file=../../.env) requires this
        # file to exist; the API + app dev servers booted by playwright's
        # webServer read their config from it, same as local development.
        run: |
          cat <<EOF > .env
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          JWT_SECRET=${JWT_SECRET}
          SETUP_KEY=${SETUP_KEY}
          NODE_ENV=${NODE_ENV}
          CORS_ORIGIN=${CORS_ORIGIN}
          PORT=${PORT}
          VITE_API_URL=${VITE_API_URL}
          VITE_APP_PORT=${VITE_APP_PORT}
          VITE_WEB_PORT=${VITE_WEB_PORT}
          EOF

      - name: Build shared package
        run: pnpm --filter @dental/shared build

      - name: Generate Prisma client
        run: pnpm --filter @dental/database db:generate

      - name: Build database package
        run: pnpm --filter @dental/database build

      - name: Run database migrations
        run: pnpm --filter @dental/database db:migrate

      - name: Seed database
        # Required: register (called by e2e/global-setup.ts) looks up the
        # enterprise plan and returns PLAN_NOT_FOUND / 500 without it.
        run: pnpm --filter @dental/database db:seed

      - name: Install Playwright browsers (web)
        run: pnpm --filter @dental/web exec playwright install --with-deps chromium

      - name: Run web e2e tests
        run: pnpm --filter @dental/web test:e2e

      - name: Install Playwright browsers (app)
        if: ${{ !cancelled() }}
        run: pnpm --filter @dental/app exec playwright install --with-deps chromium

      - name: Run app e2e tests
        if: ${{ !cancelled() }}
        run: pnpm --filter @dental/app test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/app/playwright-report
            apps/web/playwright-report
          retention-days: 7

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dental/database db:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build shared package
        run: pnpm --filter @dental/shared build

      - name: Build all packages
        run: pnpm build
        env:
          VITE_API_URL: https://api.example.com
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/api/dist
            apps/app/dist
            apps/web/dist
          retention-days: 7
